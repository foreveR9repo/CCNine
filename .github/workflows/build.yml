name: Build CCNine (rootless)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les outils (ldid, dpkg, xz)
        run: brew install ldid dpkg xz

      - name: Installer Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Infos toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Compiler le paquet .deb (rootless, arm64 + arm64e)
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Lister les paquets
        run: ls -la packages/

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: CCNine-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Créer une Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
